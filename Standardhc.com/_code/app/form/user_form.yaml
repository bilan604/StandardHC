# ~form 开头的内容用于指定表单属性
~form:
  _subject: "帐户信息"

# 指定字段及过滤器等信息

nick:
  _ui: textbox
  _filters: ['trim', 'strtolower']
  _label: "用户名"
  _req: true
  max_length: 64
  class: "vTextField"

password:
  _ui: password
  _label: "登录密码"
  _req: true
  max_length: 32
  class: "vTextField"

confirmpassword:
  _ui: password
  _label: "再次输入密码"
  _req: true
  max_length: 32
  class: "vTextField"