# ~form 开头的内容用于指定表单属性
~form:
  _subject: "添加文章"
  _addanother: true
  _continue: true

# 指定字段及过滤器等信息
channelid:
  _ui: hidden

title:
  _ui: textbox
  _filters: ['trim', 'strtolower']
  _label: "文章标题"
  _req: true
  size: 60

#keyword:
#  _ui: textbox
#  _label: "关键词"
#  _tips: "用来查找相关文章，可输入多个关键字，中间用“|”隔开。"
#  class: "vTextField"

linkurl:
  _ui: textbox
  _label: "外部链接"
  _tips: "地址应以http://开头"
  class: "vTextField"

outerlink:
  _ui: radiogroup
  _label: "是否外链"
  _req: true

intro:
  _ui: memo
  _label: "文章简介"
  _tips: "可用于对文章全文搜索的索引"
  cols: 40
  rows: 5

content:
  _ui: fckeditor
  _label: "文章内容"
  class: "vLargeTextField"
  rows: 10

hits:
  _ui: textbox
  _label: "点击数"