# ~form 开头的内容用于指定表单属性
~form:
  _subject: "Text"
  _continue: true
 
# 指定字段及过滤器等信息
en_title:
  _ui: textbox
  _filters: ['trim']
  _label: "English Title"
  _req: true
  size: 50

po_title:
  _ui: textbox
  _filters: ['trim']
  _label: "Portuguese Title"
  size: 50

parentname:
  _ui: hidden

order:
  _ui: textbox
  _label: "Sorting"
  _tips: "Order by digest desc"

content:
  _ui: fckeditor
  _label: "English body"
  class: "vLargeTextField"
  rows: 8

po_content:
  _ui: fckeditor
  _label: "Portuguese body"
  class: "vLargeTextField"
  rows: 8