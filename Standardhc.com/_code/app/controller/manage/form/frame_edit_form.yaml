# ~form 开头的内容用于指定表单属性
~form:
  _addanother: true
  _continue: true
  _labs:
    lab_common: "通用信息"
    lab_config: "附属信息"
    lab_seo: "SEO设置"

# 指定字段及过滤器等信息

frame_title:
  _lab: lab_common
  _ui: textbox
  _filters: ['trim']
  _label: "栏目标题"
  _req: true
  class: "vTextField"
  _tips: "网站上显示的标题"

subtitle:
  _ui: textbox
  _filters: ['trim']
  _label: "后台标题"
  _req: true
  class: "vTextField"
  _tips: "后台显示的标题，留空则默认设置为栏目标题"

frame_parent:
  _ui: dropdownlist
  _label: "所属上级"
  _req: true
  class: "vSelectField"

module_name:
  _ui: dropdownlist
  _label: "模块类型"
  onchange: "SetListConfig()"
  _req: true
  class: "vSelectField"

list_config:
  _ui: textbox
  _req: true
  class: "vIntegerField"
  _label: "每页显示数目"
  _tips: "请输入小于11位的整数"

frame_name:
  _ui: textbox
  _req: true
  class: "vTextField"
  _label: "URL名称"
  _tips: "优化后的访问路径，如：contact-us"

#frame_image:
#  _ui: upload
#  class: "vUploadField"
#  _help: "“请上传大小为 204 * 126 的图片”"
#  _label: "图片"

frame_status:
  _ui: radiogroup
  _label: "栏目状态"
  _req: true
  value: "publish"
  class: "vRadioField"

frame_order:
  _ui: textbox
  _label: "排序"
  class: "vIntegerField"
  _tips: "数字越大越靠前"
  value: 100

#config:
#  _lab: lab_config
#  _ui: memo
#  _label: "参数设置"
#  cols: 80
#  rows: 16
#  _tips: "YAML格式，请慎重修改"

#nested_child:
#  _ui: checkbox
#  _label: "应用到子级"
#  class: "vRadioField"

frame_intro:
  _lab: lab_config
  _ui: kindeditor
  _req: true
  _label: "简介"

seo_title:
  _lab: lab_seo
  _ui: textbox
  _label: "SEO标题"
  class: "vTextField"

seo_keywords:
  _ui: memo
  _label: "SEO关键词"
  class: "vMultipleTextField"

seo_description:
  _ui: memo
  _label: "SEO描述信息"
  class: "vMultipleTextField"