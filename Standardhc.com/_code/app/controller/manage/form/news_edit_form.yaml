# ~form 开头的内容用于指定表单属性
~form:
  _addanother: true
  _continue: true
  _labs:
    lab_common: "基本信息"
    lab_content: "详细内容"
    lab_seo: "SEO设置"

# 指定字段及过滤器等信息

page_tree:
  _ui: hidden

page_title:
  _lab: lab_common
  _ui: textbox
  _filters: ['trim']
  _label: "标题"
  _req: true
  class: "vTextField"

page_name:
  _ui: textbox
  _req: true
  class: "vTextField"
  _label: "URL地址优化"
  _tips: "优化后的访问路径，如输入：xinwen 则此新闻访问地址为 xinwen.html 留空则系统自动生成。"

page_from:
  _ui: textbox
  _req: false
  class: "vMiniTextField"
  _label: "文章来源"

#page_image:
#  _ui: upload
#  class: "vUploadField"
#  _req: true
#  _label: "新闻图片"

page_publish_date:
  _ui: textbox
  _label: "发布日期"
  _req: true
  class: "vDateField"

page_publish_time:
  _ui: textbox
  _label: "时间"
  _req: true
  class: "vTimeField"

page_status:
  _ui: radiogroup
  _label: "状态"
  _req: true
  value: true
  class: "vRadioField"

#page_hot:
#  _ui: dropdownlist
#  _label: "首页显示"
#  _req: true
#  class: "vSelectField"

page_intro:
  _lab: lab_content
  _ui: memo
  _label: "摘要"
  _tips: "内容摘要，留空则系统自动从内容中获取。"
  class: "vMultipleTextField"

page_content:
  _ui: kindeditor
  _label: "详细内容"

seo_title:
  _lab: lab_seo
  _ui: textbox
  _label: "SEO标题"
  class: "vTextField"

seo_keywords:
  _ui: memo
  _label: "SEO关键词"
  class: "vMultipleTextField"

seo_description:
  _ui: memo
  _label: "SEO描述信息"
  class: "vMultipleTextField"