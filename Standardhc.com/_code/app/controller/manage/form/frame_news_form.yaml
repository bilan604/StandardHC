# ~form 开头的内容用于指定表单属性
~form:
  _addanother: true
  _continue: true
  _labs:
    lab_common: "图片设置"

# 指定字段及过滤器等信息

frame_banner:
  _lab: lab_common
  _ui: upload
  class: "vUploadField"
  _help: "“请上传大小为 1400 * 217 的图片作为该栏目下页面的banner”"
  _label: "Banner"

frame_image:
  _ui: upload
  class: "vUploadField"
  _help: "“请上传大小为 279 * 125 的图片，用于宽屏的浏览器中显示”"
  _label: "页面右侧图片（大）"

frame_image_small:
  _ui: upload
  class: "vUploadField"
  _help: "“请上传大小为 180 * 81 的图片，用于窄屏的浏览器中显示”"
  _label: "页面右侧图片（小）"
